name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: 'Publish a release with this version tag (e.g. v1.0.0); leave empty for a normal build'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload OscreenSaver.exe
        uses: actions/upload-artifact@v4
        with:
          name: OscreenSaver
          path: build/Release/OscreenSaver.exe
          if-no-files-found: error

      - name: SHA-256 checksum
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        shell: pwsh
        run: (Get-FileHash build/Release/OscreenSaver.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii build/Release/OscreenSaver.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ("${{ inputs.release }}") { "${{ inputs.release }}" } else { "${{ github.ref_name }}" }
          $hash = Get-Content build/Release/OscreenSaver.exe.sha256
          $notes = "OscreenSaver $tag - screenshot tool for Windows 10/11 (x64). Author: Oleksii Tatarinov.`n`nDownload OscreenSaver.exe and run it; no installation is needed.`n`nSHA-256 of OscreenSaver.exe: $hash"
          gh release create "$tag" build/Release/OscreenSaver.exe build/Release/OscreenSaver.exe.sha256 --target "${{ github.sha }}" --title "OscreenSaver $tag" --notes "$notes"
