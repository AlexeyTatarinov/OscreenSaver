name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Upload OscreenSaver.exe
        uses: actions/upload-artifact@v4
        with:
          name: OscreenSaver
          path: build/Release/OscreenSaver.exe
          if-no-files-found: error

      - name: SHA-256 checksum
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: (Get-FileHash build/Release/OscreenSaver.exe -Algorithm SHA256).Hash | Out-File -Encoding ascii build/Release/OscreenSaver.exe.sha256

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = Get-Content build/Release/OscreenSaver.exe.sha256
          $notes = "OscreenSaver ${{ github.ref_name }} - screenshot tool for Windows 10/11 (x64). Author: Oleksii Tatarinov.`n`nDownload OscreenSaver.exe and run it; no installation is needed.`n`nSHA-256 of OscreenSaver.exe: $hash"
          gh release create "${{ github.ref_name }}" build/Release/OscreenSaver.exe build/Release/OscreenSaver.exe.sha256 --title "OscreenSaver ${{ github.ref_name }}" --notes "$notes"
